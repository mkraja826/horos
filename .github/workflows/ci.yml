name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Classify hosted Astro and probe analysis routes
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://hdaugtypjpniesdgyral.supabase.co/functions/v1/astro-route-probe)"
          echo "$result"
          RESULT="$result" node - <<'NODE'
          const result = JSON.parse(process.env.RESULT);
          if (result.configured !== true) throw new Error('Astro provider is not configured.');
          if (result.healthStatus !== 200) throw new Error('Astro health is unavailable.');
          if (typeof result.hostCategory !== 'string') throw new Error('Host classification is missing.');
          const values = Object.values(result.routes ?? {});
          if (values.length !== 3) throw new Error('Route probe is incomplete.');
          const current = values.every((item) => item.status === 422 && item.detailType === 'validation');
          if (!current) process.exitCode = 2;
          NODE
