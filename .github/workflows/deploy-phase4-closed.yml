name: Deploy Phase 4 Closed

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy and record outcome
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set +e
          status="unknown"
          detail=""

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            status="missing_access_token"
            exit_code=1
          else
            supabase functions deploy horos-api \
              --project-ref hdaugtypjpniesdgyral \
              --no-verify-jwt
            exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
              status="deployed"
              health="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 \
                https://hdaugtypjpniesdgyral.supabase.co/functions/v1/horos-api/health)"
              health_code=$?
              if [ "$health_code" -ne 0 ]; then
                status="health_request_failed"
                exit_code=$health_code
              else
                HEALTH="$health" node - <<'NODE'
                const health = JSON.parse(process.env.HEALTH);
                if (health.status !== 'ok') throw new Error('Hosted health is not ok.');
                if (health.astroProviderConfigured !== true) throw new Error('Astro provider is not configured.');
                if (health.phase4CompatibilityEnabled !== false) throw new Error('Compatibility flag is not closed.');
                if (health.phase4AnalysisEnabled !== false) throw new Error('Analysis flag is not closed.');
                NODE
                verify_code=$?
                if [ "$verify_code" -ne 0 ]; then
                  status="closed_state_verification_failed"
                  exit_code=$verify_code
                else
                  status="success"
                  exit_code=0
                fi
              fi
            else
              status="deploy_failed"
            fi
          fi

          mkdir -p .deployment
          printf 'status=%s\nsource_commit=%s\nrecorded_at=%s\n' \
            "$status" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .deployment/phase4-closed-status.txt

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .deployment/phase4-closed-status.txt
          git commit -m "Record Phase 4 closed deployment outcome" || true
          git push --force origin HEAD:refs/heads/ops/deployment-status

          exit "$exit_code"
