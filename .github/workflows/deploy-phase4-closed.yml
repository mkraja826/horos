name: Deploy Phase 4 Closed

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  deploy:
    if: github.head_ref == 'ops/execute-phase4-deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Deploy Horos Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy horos-api \
            --project-ref hdaugtypjpniesdgyral \
            --no-verify-jwt

      - name: Verify hosted closed state
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://hdaugtypjpniesdgyral.supabase.co/functions/v1/horos-api/health)"
          HEALTH="$health" node - <<'NODE'
          const health = JSON.parse(process.env.HEALTH);
          if (health.status !== 'ok') throw new Error('Hosted health is not ok.');
          if (health.astroProviderConfigured !== true) throw new Error('Astro provider is not configured.');
          if (health.phase4CompatibilityEnabled !== false) throw new Error('Compatibility flag is not closed.');
          if (health.phase4AnalysisEnabled !== false) throw new Error('Analysis flag is not closed.');
          console.log('PASS Horos Edge Function deployed with both Phase 4 flags closed.');
          NODE
